<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" fill="none">
  <!-- Replaces the Manus-hosted "pediatric constellation" watermark. Drawn in Cobalt
       Clinic #1647E8 (ideas.md signature colour); the CSS renders it at 12% opacity as a
       quiet corner mark, so it reads as texture rather than illustration. -->
  <g stroke="#1647e8" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M46 168 L92 104 L150 132 L196 62 L254 88"/>
    <path d="M92 104 L118 46 L196 62"/>
    <path d="M150 132 L168 186 L232 166 L254 88"/>
  </g>
  <g fill="#1647e8">
    <circle cx="46" cy="168" r="4.5"/>
    <circle cx="92" cy="104" r="6"/>
    <circle cx="150" cy="132" r="5"/>
    <circle cx="196" cy="62" r="6.5"/>
    <circle cx="254" cy="88" r="4.5"/>
    <circle cx="118" cy="46" r="4"/>
    <circle cx="168" cy="186" r="4"/>
    <circle cx="232" cy="166" r="5"/>
  </g>
  <!-- four-point sparks, echoing the flashcard-star brand mark -->
  <g fill="#e06759">
    <path d="M196 40 L199.6 55 L214 58.5 L199.6 62 L196 77 L192.4 62 L178 58.5 L192.4 55 Z" opacity="0.9"/>
    <path d="M92 84 L94.6 95 L105 97.5 L94.6 100 L92 111 L89.4 100 L79 97.5 L89.4 95 Z" opacity="0.7"/>
  </g>
</svg>
