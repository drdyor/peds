<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680">
  <!-- Replaces the Manus-hosted study-paper texture. Subtle screenprint grain over warm
       ivory, per ideas.md ("warm paper ground", "subtle screenprint texture"). Tiles at
       680px, which is the background-size the original CSS used. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.16" numOctaves="2" seed="19" result="fib"/>
      <feColorMatrix in="fib" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="680" height="680" fill="#f7f3eb"/>
  <rect width="680" height="680" filter="url(#fibre)" opacity="0.9"/>
  <rect width="680" height="680" filter="url(#grain)"/>
</svg>
